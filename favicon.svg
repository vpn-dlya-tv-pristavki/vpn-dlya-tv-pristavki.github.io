<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B18"/>
      <stop offset="100%" stop-color="#0E1830"/>
    </linearGradient>
    <linearGradient id="box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121F3C"/>
      <stop offset="100%" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D8EF8"/>
      <stop offset="100%" stop-color="#7B5CF8"/>
    </linearGradient>
    <linearGradient id="led" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E87A"/>
      <stop offset="100%" stop-color="#00C853"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- TV Box body (horizontal rectangle) -->
  <rect x="2" y="11" width="22" height="13" rx="2.5" fill="url(#box)" stroke="rgba(61,142,248,0.25)" stroke-width="0.8"/>
  <!-- Box top accent strip -->
  <rect x="2" y="11" width="22" height="3.5" rx="2.5" fill="rgba(61,142,248,0.12)"/>
  <rect x="2" y="13" width="22" height="1.5" fill="rgba(61,142,248,0.06)"/>
  <!-- LED indicator (green, glowing) -->
  <circle cx="6.5" cy="12.8" r="1.4" fill="url(#led)" filter="url(#glow)"/>
  <!-- Screen area (dark inset) -->
  <rect x="5" y="16" width="14" height="6" rx="1.5" fill="#030710"/>
  <!-- Play triangle -->
  <polygon points="10,17.5 10,20.5 14.5,19" fill="rgba(61,142,248,0.7)"/>
  <!-- Port slots on right side -->
  <rect x="20" y="17" width="2.5" height="1.5" rx="0.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="20" y="19.5" width="2.5" height="1.5" rx="0.5" fill="rgba(255,255,255,0.12)"/>
  <!-- VPN Shield badge (top right, overlapping) -->
  <circle cx="25.5" cy="11" r="6.5" fill="url(#bg)"/>
  <path d="M25.5 5.5 L29.5 7.5 L29.5 10.5 C29.5 12.8 25.5 14.5 25.5 14.5 C25.5 14.5 21.5 12.8 21.5 10.5 L21.5 7.5 Z" fill="url(#shield)"/>
  <!-- Checkmark inside shield -->
  <path d="M23.5 10.5 L25 12 L27.5 8.5" fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Box stand legs -->
  <rect x="8" y="24" width="4" height="1.8" rx="0.8" fill="rgba(61,142,248,0.2)"/>
  <rect x="14" y="24" width="4" height="1.8" rx="0.8" fill="rgba(61,142,248,0.2)"/>
  <!-- Base -->
  <rect x="6" y="25.8" width="14" height="1.2" rx="0.6" fill="rgba(61,142,248,0.15)"/>
</svg>
